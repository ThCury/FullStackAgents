# Mongo para o modo `SQUAD_PERSISTENCE=mongo`.
#
# Nao e necessario para desenvolver: os defaults do repo rodam o squad inteiro
# em memoria. Suba isso quando quiser trilha de auditoria duravel e retomada de
# run entre reinicios do processo.
services:
  mongo:
    image: mongo:7
    container_name: squad-mongo
    ports:
      - '27017:27017'
    volumes:
      - squad-mongo-data:/data/db
    command: ['--quiet']
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # UI opcional para inspecionar as colecoes de auditoria na mao.
  mongo-express:
    image: mongo-express:1
    container_name: squad-mongo-ui
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: 'false'
    depends_on:
      mongo:
        condition: service_healthy
    profiles: ['tools']

volumes:
  squad-mongo-data:

[project]
name = "fullstack-agents-squad"
version = "0.1.0"
description = "Squad autônomo de agentes de IA — Trilha B"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "langgraph>=0.2.50",
    "langchain-core>=0.3",
    "anthropic>=0.40",
    "motor>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "domain",
    "application",
    "agents",
    "pipeline",
    "factory",
    "infrastructure",
    "interfaces",
]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
# `.workspaces/` guarda o codigo GERADO pelo Dev Agent. Nao e nosso codigo e nao
# segue as nossas regras (nem deveria: ele obedece o contrato de scaffold).
extend-exclude = [".workspaces", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "TID", "RUF", "ASYNC"]
ignore = [
    "B008",  # Depends() no default de parâmetro é idiomático em FastAPI
    # N818 quer sufixo "Error" em toda exceção. Nossos erros de domínio são
    # nomeados como o evento de negócio (`BudgetExceeded`, `ReworkLimitReached`)
    # porque é assim que o time fala deles. `BudgetExceededError` não informa
    # mais nada e lê pior no `except`.
    "N818",
]

# ---------------------------------------------------------------------------
# A REGRA DE DEPENDÊNCIA DA ARQUITETURA, APLICADA PELO LINTER
#
# `domain/`, `application/` e `agents/` não podem conhecer framework nenhum.
# Isso não é convenção de code review: quebrar dá erro de lint no CI.
#
# Se você precisa de um import banido em uma camada interna, a dependência está
# invertida — crie uma *port* em `domain/ports/` e implemente em
# `infrastructure/`. Ver CONTRIBUTING.md §"Regra de dependência".
# ---------------------------------------------------------------------------
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi".msg = "Framework web: permitido só em interfaces/ e main.py."
"starlette".msg = "Framework web: permitido só em interfaces/."
"sse_starlette".msg = "Framework web: permitido só em interfaces/."
"motor".msg = "Driver de banco: permitido só em infrastructure/persistence/."
"pymongo".msg = "Driver de banco: permitido só em infrastructure/persistence/."
"anthropic".msg = "SDK do provider: permitido só em infrastructure/llm/."
"langgraph".msg = "Orquestrador: permitido só em pipeline/ e factory/."
"pydantic_settings".msg = "Config: permitido só em factory/."

[tool.ruff.lint.per-file-ignores]
# As camadas externas: é justamente o trabalho delas conhecer o framework.
"interfaces/**" = ["TID251"]
"infrastructure/**" = ["TID251"]
"pipeline/**" = ["TID251"]
"factory/**" = ["TID251"]
"application/use_cases/run_squad.py" = ["TID251"]  # importa `langgraph.types.Command`
"main.py" = ["TID251"]
"tests/**" = ["TID251", "RUF012"]
# Fixtures sao DADOS (briefing e backlog da Rivexx em prosa). Quebrar as frases
# em 100 colunas prejudicaria a leitura sem ganho nenhum.
"infrastructure/llm/fixtures.py" = ["E501"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["motor.*", "langgraph.*", "sse_starlette.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

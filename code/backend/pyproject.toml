[project]
name = "fullstack-agents"
version = "0.1.0"
description = "Backend auditável para o agente Product Owner"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "google-genai>=1.0,<2.0",
  "langgraph>=0.2,<1.0",
  "openai>=1.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
  "pymongo>=4.10,<5.0",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

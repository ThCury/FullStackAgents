<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rivexx Qualidade</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <p>Rivexx Componentes</p>
        <h1>Qualidade e rastreabilidade</h1>
      </header>
      <nav>
        <button data-tab="squad">Squad</button>
        <button data-tab="registro">Registro</button>
        <button data-tab="causa">Causa raiz</button>
        <button data-tab="lote">Rastreabilidade</button>
      </nav>
      <section id="squad" class="tab active">
        <div class="console-layout">
          <form id="briefingForm" class="panel">
            <label for="briefingInput">Briefing do cliente</label>
            <textarea id="briefingInput" name="briefing" required></textarea>
            <button type="submit">Rodar squad</button>
            <p id="runStatus"></p>
          </form>
          <aside class="panel metrics" id="runMetrics"></aside>
        </div>
        <div class="observability">
          <section>
            <h2>Conversacao entre agentes</h2>
            <div id="conversationLog"></div>
          </section>
          <section>
            <h2>Backlog PO</h2>
            <div id="backlogLog"></div>
          </section>
          <section>
            <h2>Decisoes Dev</h2>
            <div id="decisionLog"></div>
          </section>
          <section>
            <h2>Relatorio QA</h2>
            <div id="qaLog"></div>
          </section>
        </div>
      </section>
      <section id="registro" class="tab">
        <form id="form">
          <textarea name="description" required>Defeito dimensional na linha 4.</textarea>
          <input name="lot_code" value="LOTE-4521" required />
          <input name="responsible" value="Carla Mendes" required />
          <select name="shift"><option>B</option><option>A</option><option>C</option></select>
          <input name="equipment" value="INJ-04" required />
          <input name="line" value="4" required />
          <button type="submit">Registrar</button>
        </form>
        <p id="message"></p>
        <div id="records"></div>
      </section>
      <section id="causa" class="tab">
        <select id="recordSelect"></select>
        <div id="analysis"></div>
      </section>
      <section id="lote" class="tab">
        <form id="lotForm"><input name="lot" value="LOTE-4521" /><button>Consultar</button></form>
        <div id="trace"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>

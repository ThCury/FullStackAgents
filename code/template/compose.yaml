name: login-todo-template

services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/todo.db
    ports:
      - "8001:8000"
    volumes:
      - todo_data:/app/data

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8001
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  todo_data:
